[project]
name = "hmer-latex"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Christopher Coombes", email = "cjbcoombes@gmail.com" },
    { name = "Lon Pierson", email = "pierson.l@northeastern.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "editdistance>=0.8.1",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
