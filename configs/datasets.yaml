# Dataset source manifest, consumed by scripts/download_data.py.
#
# Run:
#   uv run python scripts/download_data.py crohme
#   uv run python scripts/download_data.py hme100k
# or both at once:
#   uv run python scripts/download_data.py --all
#
# Archives are checksummed with whichever of sha256/md5 is present (these
# sources only publish md5). To re-download/re-extract after the first run,
# pass --force.

crohme:
  description: >
    CROHME InkML stroke data: the 2023 competition set (online + offline +
    bi-modal, builds on 2011-2019 data plus new 2023 collection) from
    Zenodo, and the 2016 TC-11 competition package (older InkML set) from
    the figshare CROHME+HME100K bundle.
  archives:
    - name: crohme_2023
      url: https://zenodo.org/records/8428035/files/CROHME23.zip?download=1
      md5: 9eb899ddb0e87c80a17f489bf6162c33
      size_bytes: 1817362060 # ~1.8 GB
      source: https://zenodo.org/records/8428035
    - name: crohme_2016
      url: https://ndownloader.figshare.com/files/58680376
      filename: TC11_package2016.zip # ndownloader URLs have no extension in the path
      md5: 4ed9689c59b96e3daca2da79e43b1f5b
      size_bytes: 200557937 # ~200 MB
      source: https://figshare.com/articles/dataset/CROHME_and_HME100K_Handwritten_Mathematical_Expression_Datasets/30341779

hme100k:
  description: >
    HME100K camera-captured handwritten math images (Yuan et al., SAN,
    CVPR 2022), from the figshare CROHME+HME100K bundle.
  archives:
    - name: hme100k
      url: https://ndownloader.figshare.com/files/58680373
      filename: HME100K.zip # ndownloader URLs have no extension in the path
      md5: 9246808ed68b0cf71c710a78f3538bc4
      size_bytes: 728839999 # ~729 MB
      source: https://figshare.com/articles/dataset/CROHME_and_HME100K_Handwritten_Mathematical_Expression_Datasets/30341779
